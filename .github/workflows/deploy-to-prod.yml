name: deploy-to-prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to droplet over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PROD_ENV
          script_stop: true
          script: |
            set -euo pipefail
            cd /root/Hobbyflow-backend

            git fetch origin main
            git reset --hard origin/main

            if [ -z "${PROD_ENV:-}" ]; then
              echo "PROD_ENV secret is empty"
              exit 1
            fi
            printf '%s\n' "$PROD_ENV" > .env
            chmod 600 .env

            chmod +x ./1_build.sh ./2_start.sh
            ./1_build.sh
            ./2_start.sh
